name: Validate Scripts

on:
  push:
    branches: [main, ci-fix-pester]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester 5
        shell: pwsh
        run: |
          $module = Get-Module -Name Pester -ListAvailable | Where-Object { $_.Version.Major -eq 5 }
          if (-not $module) {
              Write-Host "Installing Pester 5..."
              Install-Module -Name Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser -SkipPublisherCheck
          } else {
              Write-Host "Pester 5 is already installed."
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests/discover-repos.Tests.ps1 -Output Detailed

  changelog-text:
    name: Changelog to plain text
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run the composite action
        id: reduce
        uses: ./.github/actions/changelog-text
        with:
          changelog: |
            ## Bug Fixes

            * **wind:** preserve buffers ([#726](https://example.com/issues/726))

      - name: Assert plain-text output
        shell: pwsh
        env:
          ACTUAL: ${{ steps.reduce.outputs.text }}
        run: |
          $expected = "Bug Fixes`n`n- wind: preserve buffers https://example.com/issues/726"
          $actual = ($env:ACTUAL -replace "`r`n", "`n").Trim()
          if ($actual -ne $expected) { throw "Unexpected changelog text:`n$actual" }
